name: Fdroid version file generation

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

jobs:
  # https://gitlab.com/fdroid/fdroiddata/-/blob/master/metadata/com.carriez.flutter_hbb.yml
  # Finds latest release and transforms F-Droid version code from version as follows:
  # X.Y.Z-A => X * 1e6 + Y * 1e4 + Z * 1e2 + A
  update-fdroid-version-file:
    name: Publish RustDesk version file for F-Droid updater
    runs-on: ubuntu-latest
    # The final step creates/updates the `fdroid-version` release. This repository's default
    # workflow permission is read-only, so without this the publish step fails with 403.
    permissions:
      contents: write
    steps:
      - name: Generate RustDesk version file
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            UPSTREAM_VERNAME="${GITHUB_REF##refs/tags/}"
            UPSTREAM_VERNAME="${UPSTREAM_VERNAME##v}"
          else
            # Query this fork instead of the upstream repository, otherwise the published version
            # file advertises the official build and points F-Droid clients back upstream.
            #
            # `/releases/latest` is not usable here: it skips releases flagged prerelease, and every
            # release of this project is published that way, so it answers 404. List the releases
            # instead and keep the highest stable x.y.z tag.
            UPSTREAM_VERNAME="$(
              curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                | jq -r '.[] | select(.draft | not) | .tag_name' \
                | sed 's/^v//' \
                | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -t. -k1,1n -k2,2n -k3,3n \
                | tail -n 1
            )"
            if [ -z "$UPSTREAM_VERNAME" ]; then
              echo "no stable release found in ${GITHUB_REPOSITORY}" >&2
              exit 1
            fi
          fi
          UPSTREAM_VERCODE="$(echo "$UPSTREAM_VERNAME" | tr '.' ' ' | tr '-' ' ' | while read -r MAJOR MINOR PATCH REV; do [ -z "$MAJOR" ] && MAJOR=0; [ -z "$MINOR" ] && MINOR=0; [ -z "$PATCH" ] && PATCH=0; [ -z "$REV" ] && REV=0; echo "$(( 1000000 * $MAJOR + 10000 * $MINOR + 100 * $PATCH + $REV ))"; done)"
          echo "versionName=$UPSTREAM_VERNAME"  > rustdesk-version.txt
          echo "versionCode=$UPSTREAM_VERCODE" >> rustdesk-version.txt
        shell: bash

      - name: Publish RustDesk version file
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: "fdroid-version"
          files: |
            ./rustdesk-version.txt
